<!DOCTYPE html>
<html>
<head>
    <title>Product Search Suggestion</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f7f6; }
        .search-container { margin-top: 100px; width: 400px; position: relative; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .suggestions { border: 1px solid #ddd; border-top: none; background: white; width: 100%; border-radius: 0 0 4px 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .suggestion-group { padding: 10px; border-bottom: 1px solid #eee; }
        .suggestion-group:last-child { border-bottom: none; }
        .prefix-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .word { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 4px 8px; margin: 2px; border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="search-container">
        <h2>Trie Search Engine</h2>
        <input type="text" id="query" placeholder="Start typing (e.g., 'mous')..." oninput="getSuggestions()">
        <div id="results" class="suggestions"></div>
    </div>

    <script>
        /**
         * Fetches suggestions from the Flask API as the user types.
         */
        async function getSuggestions() {
            const q = document.getElementById('query').value;
            const resDiv = document.getElementById('results');
            
            // Only search if the user has typed at least 2 characters
            if (q.length < 2) {
                resDiv.innerHTML = '';
                return;
            }

            // Fetch results from the backend search endpoint
            const response = await fetch(`/search?q=${q}`);
            const data = await response.json();

            // Build the HTML for the suggestion groups
            resDiv.innerHTML = data.map((group, index) => `
                <div class="suggestion-group">
                    <div class="prefix-label">Prefix: "${q.substring(0, index + 2)}"</div>
                    ${group.map(word => `<span class="word">${word}</span>`).join('')}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
